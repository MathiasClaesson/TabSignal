name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # csc.exe ships with .NET Framework 4.x, which is present on the runner,
      # so there is nothing to install.
      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Test
        shell: powershell
        run: .\test.ps1
